[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ifbb_data_ingestion"
version = "0.1.0"
description = "ETL pipeline and data extraction for IFBB data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pytest",
    "pandas",
    "playwright",
    "apify-client",
    "yt-dlp",
    "supabase",
    "python-dotenv",
    "PyYAML",
    "Pillow",
    "tqdm",
    "imagehash",
    "opencv-python",
    "insightface",
    "onnxruntime",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ifbb_data_ingestion*"]
